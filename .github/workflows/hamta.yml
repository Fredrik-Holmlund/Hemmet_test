# Hämtar guilden från Blizzard, bygger sidan och publicerar den på GitHub Pages. Ersätter Windows-schemat.
# Datan (snapshots, händelser, läge) committas tillbaka så att historiken växer i repot.
# Bilderna (porträtt, ikoner, helkroppsbilder) sparas i Actions-cachen.
name: Hämta och bygg

on:
  schedule:
    - cron: "5,35 * * * *"   # var 30:e minut (GitHub kan komma några minuter sent)
  workflow_dispatch:          # "Run workflow"-knappen

concurrency:
  group: hamta
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  hamta:
    runs-on: ubuntu-latest
    timeout-minutes: 30   # vanligtvis 3–5 min; första körningen utan bildcache ~17
    env:
      REALM: stitches
      GUILD: Frienship
      OUT: data/hc
      PYTHONUNBUFFERED: "1"   # loggen syns medan den körs, inte först i slutet
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pillow numpy

      - name: Bilder från förra körningen
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.OUT }}/avatars
            ${{ env.OUT }}/icons
            ${{ env.OUT }}/renders
          key: bilder-${{ github.run_id }}
          restore-keys: bilder-

      - name: Hämta
        env:
          BNET_ID: ${{ secrets.BNET_ID }}
          BNET_SECRET: ${{ secrets.BNET_SECRET }}
        run: python scripts/fetch_hemmet.py --realm "$REALM" --guild "$GUILD" --out "$OUT"

      # Sparas direkt, så att bilderna inte laddas ner igen om ett senare steg fallerar
      - name: Spara bilderna
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.OUT }}/avatars
            ${{ env.OUT }}/icons
            ${{ env.OUT }}/renders
          key: bilder-${{ github.run_id }}

      - name: Bygg
        run: |
          python scripts/build_hemmet.py
          python scripts/build_dist.py

      - name: Spara datan i repot
        run: |
          git config user.name "hemmet-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$OUT/members.json" "$OUT/items.json" "$OUT/state.json" "$OUT/events.jsonl" "$OUT/snapshots"
          if git diff --cached --quiet; then echo "Inget nytt"; exit 0; fi
          git commit -m "Hämtning $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase --autostash   # bygget ändrar filer i hemmet/ som inte ska med
          git push

      - name: Sidan till GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/
          retention-days: 3

  # Publicerar på fredrik-holmlund.github.io/Hemmet_test (eller guildens domän när den är kopplad)
  publicera:
    needs: hamta
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
