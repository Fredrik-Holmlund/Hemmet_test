<!doctype html>
<html lang="sv">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HEMMET · siffror</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Marcellus&family=Barlow+Condensed:wght@500;600&family=Spectral:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Testsida: samma KPI-rad med fyra sifferfonter. Laddas inte upp. */
body { margin: 0; background: #04070f; color: #c9bfb5; font-family: Spectral, serif; }
.wrap { max-width: 1200px; margin: 0 auto; padding: 20px 16px; display: grid; gap: 14px; }
.row { display: grid; grid-template-columns: 150px repeat(5, minmax(0, 1fr)); gap: 1px; background: rgba(244,237,228,.1); border: 1px solid rgba(244,237,228,.1); border-radius: 8px; overflow: hidden; }
.row > div { background: #0a1020; padding: 14px 18px; }
.row > div:first-child { display: grid; align-content: center; font: 600 13px/1.3 "Barlow Condensed", sans-serif; letter-spacing: .2em; text-transform: uppercase; color: #d9a93f; }
.row b { display: block; font-size: 40px; line-height: 1; color: #f4ede4; font-weight: var(--w); font-family: var(--f); font-variant-numeric: lining-nums; }
.row span { display: block; margin-top: 8px; font: 600 11px/1.2 "Barlow Condensed", sans-serif; letter-spacing: .2em; text-transform: uppercase; color: #6f655d; }
</style>
<div class="wrap" id="w"></div>
<script>
const F = [["Marcellus", "Marcellus, serif", 400], ["Cinzel", "Cinzel, serif", 500], ["Spectral", "Spectral, serif", 500], ["Barlow", "'Barlow Condensed', sans-serif", 500]];
const V = [["958", "på resan"], ["393", "på level 60"], ["+0", "levels senaste dagen"], ["33 min", "längsta passet"], ["0 / 100", "first blood"]];
document.getElementById("w").innerHTML = F.map(([n, f, w]) => `<div class="row" style="--f:${f};--w:${w}"><div>${n}</div>${V.map(([v, l]) => `<div><b>${v}</b><span>${l}</span></div>`).join("")}</div>`).join("");
</script>
</html>
